name: Build and verify NewsVoice v6.5 stable
on:
  push:
    branches: [feature/v6.5-distribution-repair]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify broadcast algorithms
        run: |
          mkdir -p /tmp/news-tests
          javac -encoding UTF-8 -d /tmp/news-tests app/src/main/java/com/newsvoice/tts/{WavTools,NewsStory,NewsAutoScript,NewsBroadcastSegments,BroadcastScriptReview,NewsSentenceTimeline,NewsScrollMath,NewsPageSplitter,NewsCoverMeta,Mp4FastStart,ShareLinks}.java tests/{WavToolsTest,NewsStoryTest,NewsAutoScriptTest,NewsBroadcastSegmentsTest,BroadcastScriptReviewTest,NewsSentenceTimelineTest,NewsScrollMathTest,NewsPageSplitterTest,NewsCoverMetaTest,Mp4FastStartTest,ShareLinksTest}.java
          for t in WavToolsTest NewsStoryTest NewsAutoScriptTest NewsBroadcastSegmentsTest BroadcastScriptReviewTest NewsSentenceTimelineTest NewsScrollMathTest NewsPageSplitterTest NewsCoverMetaTest; do java -cp /tmp/news-tests "$t"; done
          java -cp /tmp/news-tests com.newsvoice.tts.Mp4FastStartTest
          java -cp /tmp/news-tests com.newsvoice.tts.ShareLinksTest
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease
      - name: Sign long-term installation APK using existing pinned repository certificate
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 || secrets.SIGNING_KEY_BASE64 }}
          NEWSVOICE_SIGNING_STORE_PASSWORD: ${{ secrets.NEWSVOICE_SIGNING_STORE_PASSWORD }}
          NEWSVOICE_SIGNING_KEY_ALIAS: newsvoice-stable-v1
          NEWSVOICE_SIGNING_KEY_PASSWORD: ${{ secrets.NEWSVOICE_SIGNING_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_KEYSTORE_B64" || -z "$NEWSVOICE_SIGNING_STORE_PASSWORD" || -z "$NEWSVOICE_SIGNING_KEY_ALIAS" || -z "$NEWSVOICE_SIGNING_KEY_PASSWORD" ]]; then
            echo "Stable signing credentials are not configured. No installation APK will be delivered."
            exit 1
          fi
          umask 077
          KEYSTORE="$(mktemp)"
          trap 'rm -f "$KEYSTORE"' EXIT
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          APK="NewsVoice-v6.5-stable.apk"
          SOURCE="app/build/outputs/apk/release/NewsVoiceWAV-v6.5-release.apk"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$SIGNER" sign --ks "$KEYSTORE" --ks-type PKCS12 --ks-key-alias "$NEWSVOICE_SIGNING_KEY_ALIAS" --ks-pass env:NEWSVOICE_SIGNING_STORE_PASSWORD --key-pass env:NEWSVOICE_SIGNING_KEY_PASSWORD --out "$APK" "$SOURCE"
          "$SIGNER" verify --verbose --print-certs "$APK" > APK-CERT.txt
          EXPECTED="$(tr -d '[:space:]' < signing/expected-cert-sha256.txt | tr '[:lower:]' '[:upper:]')"
          ACTUAL="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' APK-CERT.txt | head -1 | tr '[:lower:]' '[:upper:]')"
          test "$ACTUAL" = "$EXPECTED"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.newsvoice.tts.v65'" >/dev/null
          sha256sum "$APK" > SHA256SUMS.txt
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Device test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: |
            adb install app/build/outputs/apk/debug/NewsVoiceWAV-v6.5-debug.apk
            adb install "$(find app/build/outputs/apk/androidTest -name '*.apk' -print -quit)"
            adb shell am instrument -w com.newsvoice.tts.v65.test/com.newsvoice.tts.LiteBroadcastTest | tee instrumentation.txt
            grep -F 'lite_tests=passed' instrumentation.txt
            adb uninstall com.newsvoice.tts.v65
            adb install NewsVoice-v6.5-stable.apk
            adb shell am start -W -n com.newsvoice.tts.v65/com.newsvoice.tts.MainActivity
            adb shell pm path com.newsvoice.tts.v65
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NewsVoice-v65-stable-signed
          path: |
            NewsVoice-v6.5-stable.apk
            instrumentation.txt
            APK-CERT.txt
            SHA256SUMS.txt

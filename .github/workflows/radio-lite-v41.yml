name: Build NewsVoice Radio Lite v4.1
on:
  push:
    branches: [feature/radio-lite-v4.1]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test TXT and SRT parser
        run: |
          mkdir /tmp/radio-tests
          javac -encoding UTF-8 -d /tmp/radio-tests RadioLite41/app/src/main/java/com/newsvoice/radio/Captions.java RadioLite41/CaptionsTest.java RadioLite41/TxtScriptTest.java RadioLite41/app/src/main/java/com/newsvoice/radio/TxtScript.java
          java -cp /tmp/radio-tests com.newsvoice.radio.CaptionsTest
          java -cp /tmp/radio-tests com.newsvoice.radio.TxtScriptTest
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle -p RadioLite41 --no-daemon :app:assembleDebug
      - name: Verify APK and publish install file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp RadioLite41/app/build/outputs/apk/debug/app-debug.apk NewsVoice-Radio-Lite-v4.1.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs NewsVoice-Radio-Lite-v4.1.apk
          sha256sum NewsVoice-Radio-Lite-v4.1.apk > SHA256SUMS.txt
          stat -c '%n %s bytes' NewsVoice-Radio-Lite-v4.1.apk
          gh release create "radio-v4.1-${GITHUB_RUN_ID}" NewsVoice-Radio-Lite-v4.1.apk SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease --title 'NewsVoice Radio Lite v4.1 test APK' --notes 'Independent Android install. TXT direct reading and MP3/SRT playback; test build, device verification pending.'
      - uses: actions/upload-artifact@v4
        with:
          name: NewsVoice-Radio-Lite-v4.1
          path: |
            NewsVoice-Radio-Lite-v4.1.apk
            SHA256SUMS.txt

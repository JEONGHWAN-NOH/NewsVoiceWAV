plugins { id 'com.android.application' }
def releaseVersion = '5.40'

android {
    namespace 'com.newsvoice.tts'
    compileSdk 35
    defaultConfig {
        applicationId 'com.newsvoice.tts.stable'
        minSdk 29
        targetSdk 35
        versionCode 48
        versionName releaseVersion
        testInstrumentationRunner 'com.newsvoice.tts.BroadcastCoverTest'
        resValue 'string', 'app_display_name', "뉴스보이스 WAV ${releaseVersion}"
    }
    // Debug testing installs alongside the existing stable app.
    buildTypes {
        debug {
            applicationIdSuffix '.lite540'
            minifyEnabled true
            shrinkResources true
            testProguardFile 'test-proguard.pro'
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    packaging { dex { useLegacyPackaging = true } }
    // Keep the raw APK filename, Android app label, and release version consistent.
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "NewsVoiceWAV-v${releaseVersion}-${variant.buildType.name}.apk"
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.work:work-runtime:2.10.5'
    implementation 'androidx.annotation:annotation:1.9.1'
}

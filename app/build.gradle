plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
def releaseVersion = '6.6'

android {
    namespace 'com.newsvoice.tts'
    compileSdk 35
    defaultConfig {
        applicationId 'com.newsvoice.tts.v66'
        minSdk 29
        targetSdk 35
        versionCode 66
        versionName releaseVersion
        testInstrumentationRunner 'com.newsvoice.tts.LiteBroadcastTest'
        resValue 'string', 'app_display_name', "뉴스보이스 WAV ${releaseVersion}"
    }
    // Long-term package ID: keep com.newsvoice.tts.v66 for all future updates.
    buildTypes {
        debug {
            minifyEnabled true
            shrinkResources true
            testProguardFile 'test-proguard.pro'
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    packaging { dex { useLegacyPackaging = true } }
    // Keep the raw APK filename, Android app label, and release version consistent.
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "NewsVoiceWAV-v${releaseVersion}-${variant.buildType.name}.apk"
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation 'androidx.work:work-runtime:2.10.5'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'com.kakao.sdk:v2-share:2.21.4'
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
}

name: Build and verify NewsVoice v6.6 stable
on:
  push:
    branches: [feature/v6.6-stable-operation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify broadcast algorithms
        run: |
          mkdir -p /tmp/news-tests
          javac -encoding UTF-8 -d /tmp/news-tests app/src/main/java/com/newsvoice/tts/{WavTools,NewsStory,NewsAutoScript,NewsBroadcastSegments,BroadcastScriptReview,NewsSentenceTimeline,NewsScrollMath,NewsPageSplitter,NewsCoverMeta,Mp4FastStart,ShareLinks}.java tests/{WavToolsTest,NewsStoryTest,NewsAutoScriptTest,NewsBroadcastSegmentsTest,BroadcastScriptReviewTest,NewsSentenceTimelineTest,NewsScrollMathTest,NewsPageSplitterTest,NewsCoverMetaTest,Mp4FastStartTest,ShareLinksTest}.java
          for t in WavToolsTest NewsStoryTest NewsAutoScriptTest NewsBroadcastSegmentsTest BroadcastScriptReviewTest NewsSentenceTimelineTest NewsScrollMathTest NewsPageSplitterTest NewsCoverMetaTest; do java -cp /tmp/news-tests "$t"; done
          java -cp /tmp/news-tests com.newsvoice.tts.Mp4FastStartTest
          java -cp /tmp/news-tests com.newsvoice.tts.ShareLinksTest
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease
      - name: Sign v6.6 APK with dedicated pinned certificate
        env:
          V66_SIGNING_BUNDLE: ${{ secrets.NEWSVOICE_V66_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          if [[ -z "$V66_SIGNING_BUNDLE" ]]; then
            echo "Dedicated v6.6 signing bundle is not configured."
            exit 1
          fi
          IFS=$'\n' read -r -d '' -a BUNDLE_LINES <<< "$V66_SIGNING_BUNDLE" || true
          test "${#BUNDLE_LINES[@]}" -eq 2
          export V66_SIGNING_PASSWORD="${BUNDLE_LINES[0]%$'\r'}"
          printf '::add-mask::%s\n' "$V66_SIGNING_PASSWORD"
          umask 077
          KEYSTORE="$(mktemp)"
          trap 'rm -f "$KEYSTORE"' EXIT
          printf '%s' "${BUNDLE_LINES[1]%$'\r'}" | base64 --decode > "$KEYSTORE"
          unset V66_SIGNING_BUNDLE BUNDLE_LINES
          APK="NewsVoice-v6.6-stable.apk"
          SOURCE="app/build/outputs/apk/release/NewsVoiceWAV-v6.6-release.apk"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$SIGNER" sign --ks "$KEYSTORE" --ks-type PKCS12 --ks-key-alias newsvoice-v66-stable --ks-pass env:V66_SIGNING_PASSWORD --key-pass env:V66_SIGNING_PASSWORD --out "$APK" "$SOURCE"
          "$SIGNER" verify --verbose --print-certs "$APK" > APK-CERT.txt
          EXPECTED="2CF2752003F7EF05838DBB2D54A69D677E40437CB14D4940D4B6E75BBDFD41E2"
          ACTUAL="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' APK-CERT.txt | head -1 | tr '[:lower:]' '[:upper:]')"
          test "$ACTUAL" = "$EXPECTED"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.newsvoice.tts.v66'" >/dev/null
          sha256sum "$APK" > SHA256SUMS.txt
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Device test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: |
            adb install app/build/outputs/apk/debug/NewsVoiceWAV-v6.6-debug.apk
            adb install "$(find app/build/outputs/apk/androidTest -name '*.apk' -print -quit)"
            adb shell am instrument -w com.newsvoice.tts.v66.test/com.newsvoice.tts.LiteBroadcastTest | tee instrumentation.txt
            grep -F 'lite_tests=passed' instrumentation.txt
            adb uninstall com.newsvoice.tts.v66
            adb install NewsVoice-v6.6-stable.apk
            adb shell am start -W -n com.newsvoice.tts.v66/com.newsvoice.tts.MainActivity
            adb shell pm path com.newsvoice.tts.v66
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NewsVoice-v66-stable-signed
          path: |
            NewsVoice-v6.6-stable.apk
            instrumentation.txt
            APK-CERT.txt
            SHA256SUMS.txt

plugins { id 'com.android.application' }
def releaseVersion = '5.37'

android {
    namespace 'com.newsvoice.tts'
    compileSdk 35
    defaultConfig {
        applicationId 'com.newsvoice.tts.stable'
        minSdk 29
        targetSdk 35
        versionCode 43
        versionName releaseVersion
        resValue 'string', 'app_display_name', "뉴스보이스 WAV ${releaseVersion}"
    }
    buildTypes {
        debug { applicationIdSuffix '.preview537' }
    }
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "NewsVoiceWAV-v${releaseVersion}-${variant.buildType.name}.apk"
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.work:work-runtime:2.10.5'
    implementation 'androidx.annotation:annotation:1.9.1'
}

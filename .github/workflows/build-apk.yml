name: Build NewsVoice WAV Automatic APK
on:
  push:
    branches: [main, feature/auto-script-thumbnails-progress]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test pure Java WAV merger
        run: |
          mkdir -p /tmp/newsvoice-classes
          javac -d /tmp/newsvoice-classes app/src/main/java/com/newsvoice/tts/WavTools.java tests/WavToolsTest.java
          java -cp /tmp/newsvoice-classes WavToolsTest
      - name: Test job-server API
        run: python3 -m unittest discover -s tests -p 'test_server.py' -v
      - name: Test article card splitting
        run: |
          mkdir -p /tmp/newsstory-classes
          javac -encoding UTF-8 -d /tmp/newsstory-classes app/src/main/java/com/newsvoice/tts/NewsStory.java tests/NewsStoryTest.java
          java -cp /tmp/newsstory-classes NewsStoryTest
      - name: Test pagination content preservation
        run: |
          mkdir -p /tmp/news-page-classes
          javac -encoding UTF-8 -d /tmp/news-page-classes app/src/main/java/com/newsvoice/tts/NewsPageSplitter.java tests/NewsPageSplitterTest.java
          java -cp /tmp/news-page-classes NewsPageSplitterTest
      - name: Verify Manila news cover date and time formatting
        run: |
          mkdir -p /tmp/newscover-classes
          javac -encoding UTF-8 -d /tmp/newscover-classes app/src/main/java/com/newsvoice/tts/NewsCoverMeta.java tests/NewsCoverMetaTest.java
          java -cp /tmp/newscover-classes NewsCoverMetaTest
      - name: Test Korean broadcaster script preflight
        run: |
          mkdir -p /tmp/broadcastreview-classes
          javac -encoding UTF-8 -d /tmp/broadcastreview-classes app/src/main/java/com/newsvoice/tts/BroadcastScriptReview.java tests/BroadcastScriptReviewTest.java
          java -cp /tmp/broadcastreview-classes BroadcastScriptReviewTest
      - name: Test news opening anchor closing and remaining-news count
        run: |
          mkdir -p /tmp/newsbroadcast-classes
          javac -encoding UTF-8 -d /tmp/newsbroadcast-classes app/src/main/java/com/newsvoice/tts/NewsStory.java app/src/main/java/com/newsvoice/tts/BroadcastScriptReview.java app/src/main/java/com/newsvoice/tts/NewsAutoScript.java app/src/main/java/com/newsvoice/tts/NewsBroadcastSegments.java tests/NewsBroadcastSegmentsTest.java
          java -cp /tmp/newsbroadcast-classes NewsBroadcastSegmentsTest
      - name: Test script-only Korean news article detection
        run: |
          mkdir -p /tmp/news-auto-classes
          javac -encoding UTF-8 -d /tmp/news-auto-classes app/src/main/java/com/newsvoice/tts/NewsStory.java app/src/main/java/com/newsvoice/tts/BroadcastScriptReview.java app/src/main/java/com/newsvoice/tts/NewsAutoScript.java app/src/main/java/com/newsvoice/tts/NewsBroadcastSegments.java tests/NewsAutoScriptTest.java
          java -cp /tmp/news-auto-classes NewsAutoScriptTest
      - name: Verify new image and progress pipeline
        run: python3 tests/test_v525_auto_images.py
      - name: Verify Download/1. 필리핀뉴스 common output folder
        run: python3 tests/test_v526_download_folder.py
      - name: Verify news single-card layout policy
        run: python3 tests/test_news_single_card.py
      - name: Verify screen-only headlines and body-only narration
        run: python3 tests/test_news_body_only_audio.py
      - name: Check built-in A opening and custom replacement
        run: python3 tests/test_opening_a_builtin.py
      - name: Test lossless sentence cues and Korean punctuation
        run: |
          mkdir -p /tmp/news-sentence-classes
          javac -encoding UTF-8 -d /tmp/news-sentence-classes app/src/main/java/com/newsvoice/tts/NewsSentenceTimeline.java tests/NewsSentenceTimelineTest.java
          java -cp /tmp/news-sentence-classes NewsSentenceTimelineTest
      - name: Verify WAV-driven scroll without highlights
        run: python3 tests/test_sentence_highlight.py
      - name: Test audio-position scroll geometry and monotonic upward movement
        run: |
          mkdir -p /tmp/news-scroll-classes
          javac -encoding UTF-8 -d /tmp/news-scroll-classes app/src/main/java/com/newsvoice/tts/NewsScrollMath.java tests/NewsScrollMathTest.java
          java -cp /tmp/news-scroll-classes NewsScrollMathTest
      - name: Verify larger readable text and continuous voice-synced scroll
        run: python3 tests/test_scroll_slide.py
      - name: Verify version label and default energetic opening
        run: python3 tests/test_v518_release.py
      - name: Verify fixed 6-second cover and the KakaoTalk poster share pipeline
        run: python3 tests/test_v519_cover_share.py
      - name: Verify 76px typography and cue-smoothed v5.20 narration sync
        run: python3 tests/test_v520_sync.py
      - name: Verify 56px typography and 700ms voice-first narration lead
        run: python3 tests/test_v521_voice_lead.py
      - name: Verify v5.26 voice lead and typography
        run: python3 tests/test_v522_voice_lead.py
      - name: Verify v5.26 voice-first 700ms and clean final card transition
        run: python3 tests/test_v523_voice_delay.py
      - name: Verify row-centered variable-speed v5.26 news scroll
        run: python3 tests/test_v524_centered_scroll.py
      - name: Install Android SDK 35 from runner SDK tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: |
          gradle --no-daemon :app:assembleDebug
          test -f app/build/outputs/apk/debug/NewsVoiceWAV-v5.26-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NewsVoiceWAV-v5.26-CenteredVoice700ms-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

name: Build and verify v3.1
on:
  push:
    branches: [feature/newsvoice-lite-v3.1]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lite:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preserved audio and article algorithms
        run: |
          mkdir -p /tmp/lite-tests
          javac -encoding UTF-8 -d /tmp/lite-tests app/src/main/java/com/newsvoice/tts/{WavTools,NewsSentenceTimeline,NewsScrollMath}.java tests/{WavToolsTest,NewsSentenceTimelineTest,NewsScrollMathTest}.java
          for t in WavToolsTest NewsSentenceTimelineTest NewsScrollMathTest; do java -cp /tmp/lite-tests "$t"; done
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK and device tests
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Preserve baseline APK
        run: curl -fL 'https://github.com/JEONGHWAN-NOH/NewsVoiceWAV/releases/download/newsvoice-lite-v3.0-45559308953-1/NewsVoice-Lite-v3.0.apk' -o baseline.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify parallel install and WAV MP4 on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: |
            adb install baseline.apk
            adb install app/build/outputs/apk/debug/NewsVoice-Lite-v3.1-debug.apk
            adb install "$(find app/build/outputs/apk/androidTest -name '*.apk' -print -quit)"
            adb shell am instrument -w com.newsvoice.tts.textlite31.test/com.newsvoice.tts.LiteBroadcastTest | tee instrumentation.txt
            grep -F 'lite_tests=passed' instrumentation.txt
            adb pull /sdcard/Download/Lite-layout.png
            adb pull /sdcard/Download/Lite-720.png
            adb pull /sdcard/Download/Lite-1080.png
            adb logcat -d -s NewsVoiceLite:I > video-sizes.txt
      - name: Verify signature and publish tested preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/NewsVoice-Lite-v3.1-debug.apk NewsVoice-Lite-v3.1.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs NewsVoice-Lite-v3.1.apk > signature.txt
          sha256sum baseline.apk NewsVoice-Lite-v3.1.apk > SHA256SUMS.txt
          stat -c '%n %s bytes' baseline.apk NewsVoice-Lite-v3.1.apk > apk-sizes.txt
          git archive --format=zip --output=NewsVoice-Lite-v3.1-source.zip HEAD app build.gradle settings.gradle gradle.properties tests .github/workflows/lite31.yml
          gh release create "newsvoice-lite-v3.1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" NewsVoice-Lite-v3.1-source.zip NewsVoice-Lite-v3.1.apk Lite-layout.png Lite-720.png Lite-1080.png instrumentation.txt video-sizes.txt signature.txt SHA256SUMS.txt apk-sizes.txt --target "$GITHUB_SHA" --prerelease --title 'NewsVoice WAV v3.1 · 텍스트 라디오 뉴스' --notes 'v3.0 병행 설치, 방송용 이미지 제거. Android 35 에뮬레이터 WAV/MP4 검증. 디버그 서명 시험판이며 실제 Galaxy 한국어 TTS·청취 품질은 미검증.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lite31-build-evidence
          path: |
            app/build/outputs/apk/
            *.txt
            Lite-*.png

name: Build Gwangmyeong News v1.3 APK
on:
  push:
    branches: [feature/gwangmyeong-v540-edition]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify independent Gwangmyeong edition
        run: python3 tests/test_gwangmyeong_v13.py
      - name: Check source-only WAV and article tests
        run: |
          mkdir -p /tmp/gm-classes
          javac -encoding UTF-8 -d /tmp/gm-classes app/src/main/java/com/newsvoice/tts/WavTools.java tests/WavToolsTest.java
          java -cp /tmp/gm-classes WavToolsTest
          javac -encoding UTF-8 -d /tmp/gm-classes app/src/main/java/com/newsvoice/tts/NewsCoverMeta.java tests/NewsCoverMetaTest.java
          java -cp /tmp/gm-classes NewsCoverMetaTest
          javac -encoding UTF-8 -d /tmp/gm-classes app/src/main/java/com/newsvoice/tts/NewsOutputNaming.java tests/NewsOutputNamingTest.java
          java -cp /tmp/gm-classes NewsOutputNamingTest
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Gwangmyeong v1.3 standalone debug APK
        run: |
          gradle --no-daemon :app:assembleDebug
          test -s app/build/outputs/apk/debug/GwangmyeongNews-v1.3-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/GwangmyeongNews-v1.3-debug.apk
      - name: Upload compiled APK for build inspection
        uses: actions/upload-artifact@v4
        with:
          name: GwangmyeongNews-v1.3-compiled-apk
          path: app/build/outputs/apk/debug/GwangmyeongNews-v1.3-debug.apk
          if-no-files-found: error
      - name: Enable hardware acceleration for Android tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Confirm Android 15 emulator installation and app launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: |
            adb install -r app/build/outputs/apk/debug/GwangmyeongNews-v1.3-debug.apk
            adb shell am start -W -n com.gwangmyeong.news.v540.trial/com.newsvoice.tts.MainActivity
      - name: Upload verified installable APK
        uses: actions/upload-artifact@v4
        with:
          name: GwangmyeongNews-v1.3-debug-apk
          path: app/build/outputs/apk/debug/GwangmyeongNews-v1.3-debug.apk
          if-no-files-found: error
      - name: Publish independent test APK for direct download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/GwangmyeongNews-v1.3-debug.apk GwangmyeongNews-v1.3.apk
          gh release create "gwangmyeong-v1.3-${GITHUB_RUN_ID}" GwangmyeongNews-v1.3.apk --target "$GITHUB_SHA" --prerelease --title "광명시 뉴스 v1.3 · 필리핀 뉴스 v5.40 기반" --notes "별도 앱 식별자로 필리핀 뉴스와 기존 광명시 뉴스 앱을 보존합니다. WAV·WebP·MP4·기사별 카드·아나운서 사진 3구간을 유지합니다. 테스트 APK이며 기존 버전의 덮어쓰기 업데이트가 아닙니다."

name: Build NewsVoice WAV Automatic APK
on:
  push:
    branches: [main, gwangmyeong-news]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test pure Java WAV merger
        run: |
          mkdir -p /tmp/newsvoice-classes
          javac -d /tmp/newsvoice-classes app/src/main/java/com/newsvoice/tts/WavTools.java tests/WavToolsTest.java
          java -cp /tmp/newsvoice-classes WavToolsTest
      - name: Check sentence cue text mapping
        run: |
          mkdir -p /tmp/gm-sentence-classes
          javac -encoding UTF-8 -d /tmp/gm-sentence-classes app/src/main/java/com/newsvoice/tts/NewsSentenceCues.java tests/NewsSentenceCuesTest.java
          java -cp /tmp/gm-sentence-classes NewsSentenceCuesTest
      - name: Package approved A type opening music in APK
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          base64 --decode app/audio-assets/opening_A_original.opus.b64 > /tmp/gm_opening_A.opus
          ffmpeg -hide_banner -loglevel error -y -i /tmp/gm_opening_A.opus -t 6 -ar 48000 -ac 2 -c:a pcm_s16le app/src/main/assets/opening_A.wav
          test "$(stat -c%s app/src/main/assets/opening_A.wav)" -gt 1000000
      - name: Test job-server API
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test article card splitting
        run: |
          mkdir -p /tmp/newsstory-classes
          javac -encoding UTF-8 -d /tmp/newsstory-classes app/src/main/java/com/newsvoice/tts/NewsStory.java tests/NewsStoryTest.java
          java -cp /tmp/newsstory-classes NewsStoryTest
      - name: Test pagination content preservation
        run: |
          mkdir -p /tmp/news-page-classes
          javac -encoding UTF-8 -d /tmp/news-page-classes app/src/main/java/com/newsvoice/tts/NewsPageSplitter.java tests/NewsPageSplitterTest.java
          java -cp /tmp/news-page-classes NewsPageSplitterTest
      - name: Verify Manila news cover date and time formatting
        run: |
          mkdir -p /tmp/newscover-classes
          javac -encoding UTF-8 -d /tmp/newscover-classes app/src/main/java/com/newsvoice/tts/NewsCoverMeta.java tests/NewsCoverMetaTest.java
          java -cp /tmp/newscover-classes NewsCoverMetaTest
      - name: Test Korean broadcaster script preflight
        run: |
          mkdir -p /tmp/broadcastreview-classes
          javac -encoding UTF-8 -d /tmp/broadcastreview-classes app/src/main/java/com/newsvoice/tts/BroadcastScriptReview.java tests/BroadcastScriptReviewTest.java
          java -cp /tmp/broadcastreview-classes BroadcastScriptReviewTest
      - name: Test news opening anchor closing and remaining-news count
        run: |
          mkdir -p /tmp/newsbroadcast-classes
          javac -encoding UTF-8 -d /tmp/newsbroadcast-classes app/src/main/java/com/newsvoice/tts/NewsStory.java app/src/main/java/com/newsvoice/tts/BroadcastScriptReview.java app/src/main/java/com/newsvoice/tts/NewsBroadcastSegments.java tests/NewsBroadcastSegmentsTest.java
          java -cp /tmp/newsbroadcast-classes NewsBroadcastSegmentsTest
      - name: Verify news single-card layout policy
        run: python3 tests/test_news_single_card.py
      - name: Verify screen-only headlines and body-only narration
        run: python3 tests/test_news_body_only_audio.py
      - name: Verify Gwangmyeong edition isolation
        run: python3 tests/test_gwangmyeong_edition.py
      - name: Install Android SDK 35 from runner SDK tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify included A opening WAV asset
        run: unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F 'assets/opening_A.wav'
      - uses: actions/upload-artifact@v4
        with:
          name: Gwangmyeong-News-v1.2-Highlight-A-Opening-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish Gwangmyeong APK for direct download
        if: github.ref == 'refs/heads/gwangmyeong-news'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/*.apk Gwangmyeong_News_WAV_v1.2_Highlight_A_Opening.apk
          tag="gwangmyeong-news-v1.2"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" Gwangmyeong_News_WAV_v1.2_Highlight_A_Opening.apk --clobber
          else
            gh release create "$tag" Gwangmyeong_News_WAV_v1.2_Highlight_A_Opening.apk \
              --target "$GITHUB_SHA" \
              --title "광명시 뉴스 WAV v1.2 (문장 하이라이트 · A 오프닝)" \
              --notes "광명시 전용. 9:16 남색·노란 제목, 본문만 낭독, 음성 샘플 길이 기반 문장별 노란 하이라이트, 승인 A형 6초 오프닝 음악 자동 삽입, 긴 기사 자동 페이지 분할, WAV/MP4 저장. 갤럭시 실기기 검수 필요."
          fi

name: Build NewsVoice WAV Automatic APK
on:
  push:
    branches: [main, feature/v530-progress-eta-anchor, feature/v5.34-news-title-image, feature/v5.34-verbatim-tts, feature/v5.36-news-cards, feature/v5.36-local-news-images, feature/v5.37-news-image-picker, feature/v5.38-broadcast-cover]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test pure Java WAV merger
        run: |
          mkdir -p /tmp/newsvoice-classes
          javac -d /tmp/newsvoice-classes app/src/main/java/com/newsvoice/tts/WavTools.java tests/WavToolsTest.java
          java -cp /tmp/newsvoice-classes WavToolsTest
      - name: Test job-server API
        run: python3 -m unittest discover -s tests -p 'test_server.py' -v
      - name: Test article card splitting
        run: |
          mkdir -p /tmp/newsstory-classes
          javac -encoding UTF-8 -d /tmp/newsstory-classes app/src/main/java/com/newsvoice/tts/NewsStory.java tests/NewsStoryTest.java
          java -cp /tmp/newsstory-classes NewsStoryTest
      - name: Test pagination content preservation
        run: |
          mkdir -p /tmp/news-page-classes
          javac -encoding UTF-8 -d /tmp/news-page-classes app/src/main/java/com/newsvoice/tts/NewsPageSplitter.java tests/NewsPageSplitterTest.java
          java -cp /tmp/news-page-classes NewsPageSplitterTest
      - name: Verify Manila news cover date and time formatting
        run: |
          mkdir -p /tmp/newscover-classes
          javac -encoding UTF-8 -d /tmp/newscover-classes app/src/main/java/com/newsvoice/tts/NewsCoverMeta.java tests/NewsCoverMetaTest.java
          java -cp /tmp/newscover-classes NewsCoverMetaTest
      - name: Test Manila date folders and same-session media names
        run: |
          mkdir -p /tmp/news-names
          javac -encoding UTF-8 -d /tmp/news-names app/src/main/java/com/newsvoice/tts/NewsOutputNaming.java tests/NewsOutputNamingTest.java
          java -cp /tmp/news-names NewsOutputNamingTest
      - name: Test Korean broadcaster script preflight
        run: |
          mkdir -p /tmp/broadcastreview-classes
          javac -encoding UTF-8 -d /tmp/broadcastreview-classes app/src/main/java/com/newsvoice/tts/BroadcastScriptReview.java tests/BroadcastScriptReviewTest.java
          java -cp /tmp/broadcastreview-classes BroadcastScriptReviewTest
      - name: Test news opening anchor closing and remaining-news count
        run: |
          mkdir -p /tmp/newsbroadcast-classes
          javac -encoding UTF-8 -d /tmp/newsbroadcast-classes app/src/main/java/com/newsvoice/tts/NewsStory.java app/src/main/java/com/newsvoice/tts/BroadcastScriptReview.java app/src/main/java/com/newsvoice/tts/NewsAutoScript.java app/src/main/java/com/newsvoice/tts/NewsBroadcastSegments.java tests/NewsBroadcastSegmentsTest.java
          java -cp /tmp/newsbroadcast-classes NewsBroadcastSegmentsTest
      - name: Test script-only Korean news article detection
        run: |
          mkdir -p /tmp/news-auto-classes
          javac -encoding UTF-8 -d /tmp/news-auto-classes app/src/main/java/com/newsvoice/tts/NewsStory.java app/src/main/java/com/newsvoice/tts/BroadcastScriptReview.java app/src/main/java/com/newsvoice/tts/NewsAutoScript.java app/src/main/java/com/newsvoice/tts/NewsBroadcastSegments.java tests/NewsAutoScriptTest.java
          java -cp /tmp/news-auto-classes NewsAutoScriptTest
      - name: Verify new image and progress pipeline
        run: python3 tests/test_v525_auto_images.py
      - name: Verify Download/1. 필리핀뉴스 common output folder
        run: python3 tests/test_v526_download_folder.py
      - name: Verify news single-card layout policy
        run: python3 tests/test_news_single_card.py
      - name: Verify screen-only headlines and body-only narration
        run: python3 tests/test_news_body_only_audio.py
      - name: Check built-in A opening and custom replacement
        run: python3 tests/test_opening_a_builtin.py
      - name: Test lossless sentence cues and Korean punctuation
        run: |
          mkdir -p /tmp/news-sentence-classes
          javac -encoding UTF-8 -d /tmp/news-sentence-classes app/src/main/java/com/newsvoice/tts/NewsSentenceTimeline.java tests/NewsSentenceTimelineTest.java
          java -cp /tmp/news-sentence-classes NewsSentenceTimelineTest
      - name: Verify WAV-driven scroll without highlights
        run: python3 tests/test_sentence_highlight.py
      - name: Test audio-position scroll geometry and monotonic upward movement
        run: |
          mkdir -p /tmp/news-scroll-classes
          javac -encoding UTF-8 -d /tmp/news-scroll-classes app/src/main/java/com/newsvoice/tts/NewsScrollMath.java tests/NewsScrollMathTest.java
          java -cp /tmp/news-scroll-classes NewsScrollMathTest
      - name: Verify larger readable text and continuous voice-synced scroll
        run: python3 tests/test_scroll_slide.py
      - name: Verify version label and default energetic opening
        run: python3 tests/test_v518_release.py
      - name: Verify fixed 6-second cover and the KakaoTalk poster share pipeline
        run: python3 tests/test_v519_cover_share.py
      - name: Verify 76px typography and cue-smoothed v5.20 narration sync
        run: python3 tests/test_v520_sync.py
      - name: Verify 56px typography and 700ms voice-first narration lead
        run: python3 tests/test_v521_voice_lead.py
      - name: Verify v5.31 voice lead and typography
        run: python3 tests/test_v522_voice_lead.py
      - name: Verify v5.31 voice-first 700ms and clean final card transition
        run: python3 tests/test_v523_voice_delay.py
      - name: Verify row-centered variable-speed v5.31 news scroll
        run: python3 tests/test_v524_centered_scroll.py
      - name: Verify stable signing and parallel-install policy
        run: python3 tests/test_v528_stable_signing.py
      - name: Install Android SDK 35 from runner SDK tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build review APK and unsigned release candidate
        run: |
          gradle --no-daemon :app:assembleDebug :app:assembleRelease
          test -s app/build/outputs/apk/debug/NewsVoiceWAV-v5.38-debug.apk
          test -s app/build/outputs/apk/release/NewsVoiceWAV-v5.38-release.apk
      - name: Upload installable debug APK (testing only; not an upgrade)
        uses: actions/upload-artifact@v4
        with:
          name: NewsVoiceWAV-v5.38-debug-testing-only
          path: app/build/outputs/apk/debug/NewsVoiceWAV-v5.38-debug.apk
          if-no-files-found: error
      - name: Upload unsigned release candidate (not for installation)
        uses: actions/upload-artifact@v4
        with:
          name: NewsVoiceWAV-v5.38-release-unsigned
          path: app/build/outputs/apk/release/NewsVoiceWAV-v5.38-release.apk
          if-no-files-found: error
      - name: Sign and verify official installable APK with pinned certificate
        id: sign
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 || secrets.SIGNING_KEY_BASE64 }}
          NEWSVOICE_SIGNING_STORE_PASSWORD: ${{ secrets.NEWSVOICE_SIGNING_STORE_PASSWORD }}
          NEWSVOICE_SIGNING_KEY_ALIAS: ${{ secrets.NEWSVOICE_SIGNING_KEY_ALIAS }}
          NEWSVOICE_SIGNING_KEY_PASSWORD: ${{ secrets.NEWSVOICE_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_KEYSTORE_B64" || -z "$NEWSVOICE_SIGNING_STORE_PASSWORD" ||
                -z "$NEWSVOICE_SIGNING_KEY_ALIAS" || -z "$NEWSVOICE_SIGNING_KEY_PASSWORD" ]]; then
            echo "GitHub signing secrets absent; NO official APK will be published."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYSTORE="$(mktemp)"
          trap 'rm -f "$KEYSTORE"' EXIT
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          SOURCE="app/build/outputs/apk/release/NewsVoiceWAV-v5.38-release.apk"
          SIGNED="app/build/outputs/apk/release/NewsVoiceWAV-v5.38-stable-signed.apk"
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" sign \
            --ks "$KEYSTORE" --ks-type PKCS12 \
            --ks-key-alias "$NEWSVOICE_SIGNING_KEY_ALIAS" \
            --ks-pass env:NEWSVOICE_SIGNING_STORE_PASSWORD \
            --key-pass env:NEWSVOICE_SIGNING_KEY_PASSWORD \
            --out "$SIGNED" "$SOURCE"
          bash scripts/verify-stable-apk.sh "$SIGNED"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Upload verified signed APK
        if: steps.sign.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NewsVoiceWAV-v5.38-stable-signed-apk
          path: app/build/outputs/apk/release/NewsVoiceWAV-v5.38-stable-signed.apk
          if-no-files-found: error
      - name: Publish signed APK for direct download (main only)
        if: github.ref == 'refs/heads/main' && steps.sign.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/NewsVoiceWAV-v5.38-stable-signed.apk"
          bash scripts/verify-stable-apk.sh "$APK"
          if gh release view v5.38 >/dev/null 2>&1; then
            gh release upload v5.38 "$APK" --clobber
          else
            gh release create v5.38 "$APK" \
              --title "뉴스보이스 WAV v5.38 · 고정 서명 신규 앱" \
              --notes "기존 v5.27과 별도 설치됩니다. 뉴스 파일은 Download/1. 필리핀뉴스/날짜별 폴더에 저장됩니다. 고정 서명 검증 완료." \
              --latest
          fi
      - name: Enable hardware acceleration for Android tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install app and verify cover import, MP4, JPG and restoration on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: |
            adb install -r app/build/outputs/apk/debug/NewsVoiceWAV-v5.38-debug.apk
            adb shell am start -W -n com.newsvoice.tts.stable.lite538/com.newsvoice.tts.MainActivity
            gradle --no-daemon :app:connectedDebugAndroidTest
            adb logcat -d -s NewsVoiceSize:I > comparison.txt
            cat comparison.txt
            adb pull /sdcard/Download/NewsVoice720.jpg NewsVoice720.jpg
            adb pull /sdcard/Download/NewsVoice1080.jpg NewsVoice1080.jpg
      - name: Provide tested standalone cover edition APK
        if: github.ref == 'refs/heads/feature/v5.38-broadcast-cover'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/NewsVoiceWAV-v5.38-debug.apk NewsVoice-v5.38.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose NewsVoice-v5.38.apk
          gh release create "v5.38-lite-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" NewsVoice-v5.38.apk NewsVoice720.jpg NewsVoice1080.jpg comparison.txt --target "$GITHUB_SHA" --prerelease --title "뉴스보이스 v5.38 · 경량 MP4" --notes "v5.37과 함께 설치하는 방송 표지 선택판입니다."

name: Build NewsVoice Radio Lite v4.2
on:
  push:
    branches: [feature/radio-lite-v4.2]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test TXT and SRT parser
        run: |
          mkdir /tmp/radio-tests
          javac -encoding UTF-8 -d /tmp/radio-tests RadioLite42/app/src/main/java/com/newsvoice/radio/Captions.java RadioLite42/CaptionsTest.java RadioLite42/TxtScriptTest.java RadioLite42/app/src/main/java/com/newsvoice/radio/TxtScript.java
          java -cp /tmp/radio-tests com.newsvoice.radio.CaptionsTest
          java -cp /tmp/radio-tests com.newsvoice.radio.TxtScriptTest
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle -p RadioLite42 --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify five minute MP4 on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: |
            adb install RadioLite42/app/build/outputs/apk/debug/app-debug.apk
            adb install RadioLite42/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.newsvoice.radio.v42.test/com.newsvoice.radio.VideoSmokeTest | tee radio42-test.txt
            grep -F 'radio42=passed' radio42-test.txt
            adb exec-out run-as com.newsvoice.radio.v42 cat files/broadcast.mp4 > RadioLite42-5min-test.mp4
      - name: Verify APK and publish install file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp RadioLite42/app/build/outputs/apk/debug/app-debug.apk NewsVoice-Radio-Lite-v4.2.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs NewsVoice-Radio-Lite-v4.2.apk
          sha256sum NewsVoice-Radio-Lite-v4.2.apk > SHA256SUMS.txt
          stat -c '%n %s bytes' NewsVoice-Radio-Lite-v4.2.apk
          gh release create "radio-v4.2-${GITHUB_RUN_ID}" NewsVoice-Radio-Lite-v4.2.apk SHA256SUMS.txt radio42-test.txt RadioLite42-5min-test.mp4 --target "$GITHUB_SHA" --prerelease --title 'NewsVoice Radio Lite v4.2 test APK' --notes 'Independent Android install. TXT reading and 360x640 lightweight MP4; five minute Android emulator test passed. Galaxy device verification pending.'
      - uses: actions/upload-artifact@v4
        with:
          name: NewsVoice-Radio-Lite-v4.2
          path: |
            NewsVoice-Radio-Lite-v4.2.apk
            SHA256SUMS.txt
            radio42-test.txt
            RadioLite42-5min-test.mp4

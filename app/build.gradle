plugins { id 'com.android.application' }
def releaseVersion = '1.1.1'

android {
    namespace 'com.newsvoice.tts'
    compileSdk 35
    defaultConfig {
        applicationId 'com.gwangmyeong.news'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName releaseVersion
        resValue 'string', 'app_display_name', "광명시 종합 뉴스 ${releaseVersion}"
    }
    // Debug testing installs alongside the existing stable app.
    buildTypes {
        debug { }
    }
    // Keep the raw APK filename, Android app label, and release version consistent.
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "GwangmyeongNews-v${releaseVersion}-${variant.buildType.name}.apk"
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.work:work-runtime:2.10.5'
    implementation 'androidx.annotation:annotation:1.9.1'
}
